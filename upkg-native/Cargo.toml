[package]
name = "upkg-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
autobins = false
license = "BSD-2-Clause"
repository = "https://github.com/seuros/upkg"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process"] }
console = "0.16.2"
indicatif = "0.18.3"
dirs = "6"

# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# I/O
rama = { version = "0.3.0-alpha.4", features = ["http-full", "rustls"] }
flate2 = "1.1.8"
tar = "0.4.44"
xz2 = "0.1.7"
zstd = "0.13.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
futures-util = "0.3.31"
rayon = "1.11.0"
regex = "1.12.2"
sha2 = "0.11.0"
walkdir = "2.5.0"
object = "0.39.1"
url = "2.5.8"
tree-sitter = "0.26.8"
tree-sitter-ruby = "0.23.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(target_os = "linux")'.dependencies]
arwen = "0.0.5"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
rstest = "0.26.1"
