[package]
name = "upkg"
version = "0.19.0"
description = "A universal package manager frontend that speaks the dialect of dozens of native package managers"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"
repository = "https://github.com/seuros/upkg"

[lib]
path = "src/lib.rs"

[[bin]]
name = "upkg"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "postgresql"
required-features = ["cli"]

[features]
default = ["cli"]
# The `upkg` binary: argument parsing, the alias catalog, self-upgrade and the
# built-in macOS engine.
cli = [
    "host",
    "dep:usage-rs",
    "dep:serde_json",
    "dep:toml",
    "dep:tokio",
    "dep:rama",
    "dep:flate2",
    "dep:tar",
    "dep:sha2",
    "dep:url",
    "dep:console",
    "dep:indicatif",
    "dep:xz2",
    "dep:zstd",
    "dep:zip",
    "dep:rusqlite",
    "dep:futures-util",
    "dep:rayon",
    "dep:walkdir",
    "dep:tree-sitter",
    "dep:tree-sitter-ruby",
    "dep:chrono-machines",
    "dep:shlex",
]
# The host-maintenance library (`upkg::host`): std and serde, nothing else.
host = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
usage-rs = { version = "6.12.0", default-features = false, features = ["help", "diagnostics", "completions"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "fs", "process"], optional = true }
rama = { version = "0.4.0", features = ["http-backend", "tcp", "dns", "rustls", "ring"], optional = true }
flate2 = { version = "1.1.10", optional = true }
tar = { version = "0.4.46", optional = true }
sha2 = { version = "0.11.0", optional = true }
url = { version = "2.5.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
console = { version = "0.16.6", optional = true }
indicatif = { version = "0.18.6", optional = true }
xz2 = { version = "0.1.7", features = ["static"], optional = true }
zstd = { version = "0.14.0", default-features = false, optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
rusqlite = { version = "0.40.2", optional = true }
futures-util = { version = "0.3.34", optional = true }
rayon = { version = "1.12.0", optional = true }
walkdir = { version = "2.5.0", optional = true }
tree-sitter = { version = "0.27.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
chrono-machines = { version = "0.8.0", features = ["async"], optional = true }
shlex = { version = "2.0.1", optional = true }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rstest = { version = "0.27.0", default-features = false }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
