[package]
name = "upkg"
version = "0.14.0"
description = "A universal package manager frontend that speaks the dialect of dozens of native package managers"
edition = "2024"
rust-version = "1.99"
license = "BSD-2-Clause"
repository = "https://github.com/seuros/upkg"

[target.'cfg(not(target_os = "macos"))'.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
rama = { version = "0.4.0", features = ["http-backend", "tcp", "dns", "rustls", "ring"] }
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.0"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
console = "0.16.6"
indicatif = "0.18.6"
serde_json = "1.0.151"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = { version = "0.14.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rusqlite = "0.40.2"
futures-util = "0.3.34"
rayon = "1.12.0"
walkdir = "2.5.0"
tree-sitter = "0.27.0"
tree-sitter-ruby = "0.23.1"
chrono-machines = { version = "0.8.0", features = ["async"] }
shlex = "2.0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rstest = { version = "0.27.0", default-features = false }

[dependencies]
usage-rs = { version = "6.11.1", default-features = false, features = ["help", "diagnostics", "completions"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
