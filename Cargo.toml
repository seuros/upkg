[package]
name = "upkg"
version = "0.12.1"
description = "A universal package manager frontend that speaks the dialect of dozens of native package managers"
edition = "2024"
rust-version = "1.98"
license = "BSD-2-Clause"
repository = "https://github.com/seuros/upkg"

[target.'cfg(not(target_os = "macos"))'.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
rama = { version = "0.4.0", features = ["http-backend", "tcp", "dns", "rustls", "ring"] }
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.0"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
console = "0.16.4"
indicatif = "0.18.6"
serde_json = "1.0.151"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = "0.13.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rusqlite = "0.40.2"
futures-util = "0.3.34"
rayon = "1.12.0"
walkdir = "2.5.0"
tree-sitter = "0.26.13"
tree-sitter-ruby = "0.23.1"
chrono-machines = { version = "0.6.0", features = ["async"] }
rand = "0.10.2"
shlex = "2.0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rstest = "0.26.1"

[dependencies]
usage-rs = "6.7.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
